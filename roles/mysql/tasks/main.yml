  -  name: enable the mysql:8.4
     command: "dnf module enable mysql:8.4 -y"
  
  - name: install mysql server 8.4
    package:
      name: mysql-server
      state: present

  - name: enable and start mysql server
    service:
      name: mysqld
      state: restarted
      enabled: yes
    
  - name: setup the mysql server root password
    command: "mysql_secure_installation --set-root-pass {{ mysql_root_password  }}"